<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario FabLab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html"><strong>FabLab</strong> Inventario</a>
    <div id="userNav" class="ms-auto d-flex align-items-center"></div>
  </div>
</nav>

<main class="container py-4">
  <section class="hero mb-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div>
        <h1 class="h3 mb-1">Inventario y préstamo de material</h1>
        <p class="mb-0 text-muted">Consulta por Zona → Subzona → Ubicación específica; filtra por FabAcademy y solicita material.</p>
        <div id="dashboardRoleHint" class="small text-muted mt-2"></div>
      </div>
      <button class="btn btn-primary" id="openCart" data-bs-toggle="modal" data-bs-target="#cartModal">Carrito <span id="cartCount" class="badge text-bg-light">0</span></button>
    </div>
  </section>

  <section class="card shadow-sm mb-4"><div class="card-body">
    <div class="row g-2">
      <div class="col-lg-3 col-md-6"><label class="form-label small mb-1" for="search">Buscar</label><input id="search" class="form-control filter-input" placeholder="Nombre, SKU o descripción"></div>
      <div class="col-lg-2 col-md-6"><label class="form-label small mb-1" for="filterTipo">Tipo</label><select id="filterTipo" class="form-select filter-input"></select></div>
      <div class="col-lg-2 col-md-6"><label class="form-label small mb-1" for="filterZone">Zona</label><select id="filterZone" class="form-select filter-input"></select></div>
      <div class="col-lg-2 col-md-6"><label class="form-label small mb-1" for="filterSubzone">Subzona</label><select id="filterSubzone" class="form-select filter-input"></select></div>
      <div class="col-lg-3 col-md-6"><label class="form-label small mb-1" for="filterLocation">Ubicación</label><select id="filterLocation" class="form-select filter-input"></select></div>
      <div class="col-lg-3 col-md-6"><label class="form-label small mb-1" for="filterRelatedMachine">Máquina relacionada</label><select id="filterRelatedMachine" class="form-select filter-input"></select></div>
      <div class="col-lg-3 col-md-6"><label class="form-label small mb-1" for="filterWeek">FabAcademy</label><select id="filterWeek" class="form-select filter-input"></select></div>
    </div>
    <div class="d-flex justify-content-between align-items-center mt-3">
      <span id="resultCount" class="small text-muted">0 resultado(s)</span>
      <div class="d-flex gap-2"><button id="clearFilters" class="btn btn-sm btn-outline-secondary">Limpiar filtros</button><button id="exportCsv" class="btn btn-sm btn-outline-success">Exportar CSV visible</button></div>
    </div>
  </div></section>

  <section id="itemsList"></section>
</main>

<div class="modal fade" id="cartModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Carrito de solicitud</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><div id="cartBody"></div><textarea id="loanComments" class="form-control mt-3" rows="3" placeholder="Comentarios para el técnico: proyecto, práctica, fecha de uso, etc."></textarea></div>
  <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button><button id="submitLoan" class="btn btn-primary">Enviar solicitud</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/catalogo.js"></script>
</body></html>

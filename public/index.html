<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario FabLab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html"><strong>FabLab</strong> Inventario</a>
    <div class="ms-auto d-flex align-items-center gap-2">
      <button class="btn btn-primary btn-sm" id="openCart" data-bs-toggle="modal" data-bs-target="#cartModal">
        Carrito <span id="cartCount" class="badge text-bg-light">0</span>
      </button>
      <div id="userNav" class="d-flex align-items-center gap-2"></div>
    </div>
  </div>
</nav>

<main class="container py-3">
  <section class="card shadow-sm mb-4"><div class="card-body">
    <div class="row g-2 align-items-end">
      <div class="col-lg-4 col-md-6">
        <label class="form-label small mb-1" for="filterZone">Zona</label>
        <select id="filterZone" class="form-select filter-input"></select>
      </div>
      <div class="col-lg-4 col-md-6">
        <label class="form-label small mb-1" for="filterSubzone">Subzona</label>
        <select id="filterSubzone" class="form-select filter-input"></select>
      </div>
      <div class="col-lg-4 col-md-12">
        <label class="form-label small mb-1" for="filterLocation">Ubicación</label>
        <select id="filterLocation" class="form-select filter-input"></select>
      </div>
    </div>

    <div class="row g-2 align-items-end mt-1">
      <div class="col-lg-4 col-md-6">
        <label class="form-label small mb-1" for="filterTipo">Tipo</label>
        <select id="filterTipo" class="form-select filter-input"></select>
      </div>
      <div class="col-lg-4 col-md-6">
        <label class="form-label small mb-1" for="filterWeek">FabAcademy</label>
        <select id="filterWeek" class="form-select filter-input"></select>
      </div>
    </div>

    <div class="row g-2 align-items-end mt-1">
      <div class="col-lg-6 col-md-12">
        <label class="form-label small mb-1" for="search">Buscar</label>
        <input id="search" class="form-control filter-input" placeholder="Nombre, SKU o descripción">
      </div>
      <div class="col-lg-2 col-md-4">
        <span id="resultCount" class="small text-muted d-block pb-2">0 resultado(s)</span>
      </div>
      <div class="col-lg-2 col-md-4">
        <button id="clearFilters" class="btn btn-outline-secondary w-100">Limpiar filtros</button>
      </div>
      <div class="col-lg-2 col-md-4">
        <button id="exportXlsx" class="btn btn-outline-success w-100">Exportar Excel filtrado</button>
      </div>
    </div>
  </div></section>

  <section id="itemsList"></section>
</main>

<div class="modal fade" id="cartModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Carrito de solicitud</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><div id="cartBody"></div><textarea id="loanComments" class="form-control mt-3" rows="3" placeholder="Comentarios para el técnico: proyecto, práctica, fecha de uso, etc."></textarea></div>
  <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button><button id="submitLoan" class="btn btn-primary">Enviar solicitud</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module" src="js/catalogo.js"></script>
</body></html>
